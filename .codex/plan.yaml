version: 1
timekeeping:
  timezone: Asia/Bangkok
  script: ./scripts/current_time.sh
  instructions: >
    Use the script to stamp ISO-8601 timestamps on all audit logs, reports, and releases
    so cloud/local agents share the same UTC+07:00 clock source.
plan:
  - id: bootstrap_codex_agent_system
    description: "Setup full Codex-Agent organization environment and branches"
    agent: engineer
    prompt: |
      Initialize Codex-Agent organization base structure with the following:
      1. Create directories:
         - .codex/, agents/, docs/, workspace/, audit/, reports/, finance/
      2. Create default files:
         - README.md (executive overview)
         - docs/ORG_DESIGN.md (imported from provided design)
         - .codex/plan.yaml (sample plan below)
         - agents/product/prompt.md, agents/engineer/prompt.md, agents/hr/prompt.md
      3. Initialize Git branches:
         - `main` → stable
         - `dev` → development
         - `codex/auto` → for automated commits
      4. Commit initial structure and push.
    output: "Initialization report and folder tree confirmation"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: Project Registration
  # -----------------------------------------------------
  - id: register_project
    description: "Register a new project in the organization registry"
    agent: product
    prompt: |
      Create or update docs/PROJECTS.md with the following entry:
      - name: hello-agent
      - purpose: Sandbox and development testbed for Codex-Agent orchestration
      - owner: engineer_agent
      - repo: https://github.com/chankung9/hello-agent
      - status: active
      - notes: Used to validate manual handoff between ChatGPT Workspace and Codex.

      Make sure PROJECTS.md includes a header section describing the registry format, e.g.:
      ```
      # Project Registry
      Each entry defines a project integrated with the Codex-Agent organization.
      Fields: name, purpose, owner, repo, status, notes
      ```
    output: "docs/PROJECTS.md"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # UPDATED STEP: Integration Setup
  # -----------------------------------------------------
  - id: create_hello_agent_link
    depends_on: register_project
    description: "Link hello-agent repo as first sandbox service"
    agent: engineer
    prompt: |
      Using the entry defined in docs/PROJECTS.md, configure integration between codex-agent and hello-agent:
      1. Confirm that project 'hello-agent' exists in the registry.
      2. Generate an integration note file: docs/INTEGRATION_HELLO_AGENT.md
      3. Include:
         - Summary of hello-agent purpose and repository link
         - Integration checklist (plan sync, report flow, workspace link)
         - Next step: Prepare plan to generate MVP_PLAN.md in hello-agent/docs/
      4. Commit the new file and update PROJECTS.md to include integration status.
    output: "docs/INTEGRATION_HELLO_AGENT.md"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: MVP Plan Draft
  # -----------------------------------------------------
  - id: hello_agent_mvp_plan
    depends_on: create_hello_agent_link
    description: "Author hello-agent MVP plan and align with pipeline gates"
    agent: engineer
    prompt: |
      Reference projects/hello-agent/tasks/mvp_plan_001.yaml and complete the following:
      1. Draft docs/MVP_PLAN.md inside the hello-agent repo (downstream) covering scope, milestones, and owners.
      2. Ensure pipeline.yaml gates (product_review, finance_review) have assigned reviewers for this effort.
      3. Update docs/INTEGRATION_HELLO_AGENT.md checklist once MVP plan lands.
      4. Capture kickoff + approvals in audit/logs/<date>.md.
    output: "hello-agent/docs/MVP_PLAN.md"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: Staff Reflections
  # -----------------------------------------------------
  - id: hello_agent_staff_reports
    depends_on: hello_agent_mvp_plan
    description: "Collect short reports from each hello-agent stakeholder"
    agent: hr
    prompt: |
      Each involved agent (Product, Engineer, Finance, HR, Compliance) must file a brief report after major milestones.
      1. Use `reports/projects/hello-agent/staff_report_TEMPLATE.md`.
      2. Save individual reports under `reports/projects/hello-agent/staff_reports/<agent>_<date>.md`.
      3. Cover work summary, feelings/sentiment, recommendations, and place/role in the project.
      4. Reference evidence (commits, audit entries, release summaries) and log completion in `audit/logs/<date>.md`.
      5. Capture `timezone`, `timestamp`, and `time_source` metadata using `./scripts/current_time.sh` so every record is anchored to Asia/Bangkok (UTC+07:00).
    output: "reports/projects/hello-agent/staff_reports/"
    meta:
      branch: dev
      auto_commit_branch: codex/auto
