version: 1
timekeeping:
  timezone: Asia/Bangkok
  script: ./scripts/current_time.sh
  instructions: >
    Use the script to stamp ISO-8601 timestamps on all audit logs, reports, and releases
    so cloud/local agents share the same UTC+07:00 clock source.
plan:
  - id: bootstrap_codex_agent_system
    description: "Setup full Codex-Agent organization environment and branches"
    agent: engineer
    prompt: |
      Initialize Codex-Agent organization base structure with the following:
      1. Create directories:
         - .codex/, agents/, docs/, workspace/, audit/, reports/, finance/
      2. Create default files:
         - README.md (executive overview)
         - docs/ORG_DESIGN.md (imported from provided design)
         - .codex/plan.yaml (sample plan below)
         - agents/product/prompt.md, agents/engineer/prompt.md, agents/hr/prompt.md
      3. Initialize Git branches:
         - `main` → stable
         - `dev` → development
         - `codex/auto` → for automated commits
      4. Commit initial structure and push.
    output: "Initialization report and folder tree confirmation"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: Project Registration
  # -----------------------------------------------------
  - id: register_project
    description: "Register a new project in the organization registry"
    agent: product
    prompt: |
      Create or update docs/PROJECTS.md with the following entry:
      - name: hello-agent
      - purpose: Sandbox and development testbed for Codex-Agent orchestration
      - owner: engineer_agent
      - repo: https://github.com/chankung9/hello-agent
      - status: active
      - notes: Used to validate manual handoff between ChatGPT Workspace and Codex.

      Make sure PROJECTS.md includes a header section describing the registry format, e.g.:
      ```
      # Project Registry
      Each entry defines a project integrated with the Codex-Agent organization.
      Fields: name, purpose, owner, repo, status, notes
      ```
    output: "docs/PROJECTS.md"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # UPDATED STEP: Integration Setup
  # -----------------------------------------------------
  - id: create_hello_agent_link
    depends_on: register_project
    description: "Link hello-agent repo as first sandbox service"
    agent: engineer
    prompt: |
      Using the entry defined in docs/PROJECTS.md, configure integration between codex-agent and hello-agent:
      1. Confirm that project 'hello-agent' exists in the registry.
      2. Generate an integration note file: docs/INTEGRATION_HELLO_AGENT.md
      3. Include:
         - Summary of hello-agent purpose and repository link
         - Integration checklist (plan sync, report flow, workspace link)
         - Next step: Prepare plan to generate MVP_PLAN.md in hello-agent/docs/
      4. Commit the new file and update PROJECTS.md to include integration status.
    output: "docs/INTEGRATION_HELLO_AGENT.md"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: MVP Plan Draft
  # -----------------------------------------------------
  - id: hello_agent_mvp_plan
    depends_on: create_hello_agent_link
    description: "Author hello-agent MVP plan and align with pipeline gates"
    agent: engineer
    prompt: |
      Reference projects/hello-agent/tasks/mvp_plan_001.yaml and complete the following:
      1. Draft docs/MVP_PLAN.md inside the hello-agent repo (downstream) covering scope, milestones, and owners.
      2. Ensure pipeline.yaml gates (product_review, finance_review) have assigned reviewers for this effort.
      3. Update docs/INTEGRATION_HELLO_AGENT.md checklist once MVP plan lands.
      4. Capture kickoff + approvals in audit/logs/<date>.md.
    output: "hello-agent/docs/MVP_PLAN.md"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: Staff Reflections
  # -----------------------------------------------------
  - id: hello_agent_staff_reports
    depends_on: hello_agent_mvp_plan
    description: "Collect short reports from each hello-agent stakeholder"
    agent: hr
    prompt: |
      Each involved agent (Product, Engineer, Finance, HR, Compliance) must file a brief report after major milestones.
      1. Use `reports/projects/hello-agent/staff_report_TEMPLATE.md`.
      2. Save individual reports under `reports/projects/hello-agent/staff_reports/<agent>_<date>.md`.
      3. Cover work summary, feelings/sentiment, recommendations, and place/role in the project.
      4. Reference evidence (commits, audit entries, release summaries) and log completion in `audit/logs/<date>.md`.
      5. Capture `timezone`, `timestamp`, and `time_source` metadata using `./scripts/current_time.sh` so every record is anchored to Asia/Bangkok (UTC+07:00).
    output: "reports/projects/hello-agent/staff_reports/"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: Cyphercast Roadmap Detail
  # -----------------------------------------------------
  - id: detail_cyphercast_roadmap
    description: "Derive development roadmap and tasks for cyphercast"
    agent: product
    prompt: |
      Review existing cyphercast documentation (ENGINEERING_BEST_PRACTICES.md, SOFTWARE_ENGINEERING_POLICY.md, Phase 2 docs, downstream ARCHITECTURE.md/TESTING.md) and generate a development roadmap covering:
        1. Frontend milestones (scaffolding, wallet integration, UI polish)
        2. On-chain alignment (program readiness, surfpool usage)
        3. Testing strategy progression (unit → CLI/manual → integration smoke checklist)
        4. Release handoff requirements and audit expectations.
      - Create `projects/cyphercast/docs/DEV_ROADMAP.md` summarising phases and dependencies.
      - Produce task YAML files (e.g., `projects/cyphercast/tasks/roadmap_<sequence>.yaml`) that itemise actionable work.
      - Update `.codex/plan.yaml` with any new cross-team tasks and note key decisions in `audit/logs/<date>.md`.
      Reference `projects/cyphercast/docs/INTEGRATION_SMOKE_CHECKLIST.md` to align final integration steps.
    output: |
      projects/cyphercast/docs/DEV_ROADMAP.md;
      projects/cyphercast/tasks/roadmap_*.yaml;
      .codex/plan.yaml updates; audit log entry if applicable
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: Cyphercast Frontend Scaffold
  # -----------------------------------------------------
  - id: cyphercast_frontend_scaffold
    depends_on: detail_cyphercast_roadmap
    description: "Implement Phase 1 frontend scaffold for cyphercast"
    agent: engineer
    prompt: |
      Execute `projects/cyphercast/tasks/roadmap_frontend_001.yaml`:
        - Initialize the frontend application using the recommended stack (Next.js or Vite with pnpm).
        - Configure linting, formatting, type-checking, and Storybook per engineering best practices.
        - Establish base routes/layouts and shadcn/ui design tokens.
      Sync documentation updates (`DEV_ROADMAP.md`, `CHANGELOG.md`) and capture doc-sync evidence.
    output: "Frontend scaffold committed with tooling scripts; doc-sync log entry"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: Cyphercast Wallet Integration
  # -----------------------------------------------------
  - id: cyphercast_wallet_integration
    depends_on: cyphercast_frontend_scaffold
    description: "Deliver wallet adapter stack and Solana client services"
    agent: engineer
    prompt: |
      Complete `projects/cyphercast/tasks/roadmap_wallet_integration_002.yaml`:
        - Implement wallet provider using @solana/wallet-adapter with shadcn/ui modal.
        - Create RPC/IDL helpers for Surfpool/localnet and document environment configuration.
        - Demonstrate a sample join/predict transaction against localnet.
      Update integration docs and log outcomes in audit records.
    output: "Wallet integration merged with documented configuration and sample transaction evidence"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: Cyphercast Prediction UX
  # -----------------------------------------------------
  - id: cyphercast_prediction_ux
    depends_on: cyphercast_wallet_integration
    description: "Implement prediction submission and reward claim experiences"
    agent: engineer
    prompt: |
      Execute `projects/cyphercast/tasks/roadmap_prediction_ux_003.yaml` to deliver stream list, prediction entry, results, and claim flows wired to the Solana program. Ensure analytics logging and accessibility compliance per engineering best practices.
      Record successful end-to-end localnet demonstration and update roadmap documentation.
    output: "Prediction UI flows functional on localnet with evidence in audit log"
    meta:
      branch: dev
      auto_commit_branch: codex/auto

  # -----------------------------------------------------
  # NEW STEP: Cyphercast Quality & Release Readiness
  # -----------------------------------------------------
  - id: cyphercast_quality_release
    depends_on: cyphercast_prediction_ux
    description: "Harden testing pipeline and prepare release handoff"
    agent: engineer
    prompt: |
      Address `projects/cyphercast/tasks/roadmap_quality_release_004.yaml`:
        - Achieve CI coverage for lint/unit/component/Playwright suites.
        - Execute the integration smoke checklist and log results.
        - Update changelog, integration record, and ensure release approvals per policy.
        - Confirm Docs Link Check workflow passes on the PR prior to merge.
      Provide final audit entry with release readiness summary.
    output: "Quality gates satisfied, smoke checklist executed, release evidence logged"
    meta:
      branch: dev
      auto_commit_branch: codex/auto
